# Builds the standalone desktop edition (React UI + Spring Boot + embedded H2 database + its own Java runtime)
# for Windows, macOS and Linux with jpackage. Nothing needs to be installed on the user's machine.
#   * Manual run  : Actions > Package desktop apps > Run workflow  -> downloadable artifacts
#   * Tag  v1.0.0 : same, plus a GitHub Release with the files attached
name: Package desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the GitHub Release on tags

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows, installer: msi }
          - { os: macos-latest,   label: macOS,   installer: dmg }
          - { os: ubuntu-latest,  label: Linux,   installer: deb }
    defaults:
      run:
        shell: bash
    env:
      APP_NAME: PharmaPackQMS
      APP_VERSION: "1.0.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci || npm install
          npx vite build
          test -f dist/index.html

      - name: Build Spring Boot jar (UI bundled inside)
        run: |
          mvn -B -ntp clean package -DskipTests
          mkdir -p staging
          cp target/pharmapack-qms-*.jar staging/app.jar
          unzip -l staging/app.jar | grep -q "BOOT-INF/classes/static/index.html" && echo "UI bundled OK"

      - name: Smoke test (embedded database, headless)
        run: |
          java -Dspring.profiles.active=desktop -Djava.awt.headless=true -Duser.home="$RUNNER_TEMP" \
               -jar staging/app.jar > app.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" \
                   -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/auth/login || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "login HTTP $code"; [ "$code" = "200" ] || { cat app.log; exit 1; }
          ui=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "UI HTTP $ui"; [ "$ui" = "200" ] || { cat app.log; exit 1; }

      - name: Full API regression against the embedded database (Linux)
        if: runner.os == 'Linux'
        working-directory: automation
        run: mvn -B -ntp test -DbaseUrl=http://localhost:8080/api

      - name: Create app image (portable, no install needed)
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "Windows" ] && EXTRA="--win-console"
          jpackage --type app-image --name "$APP_NAME" --app-version "$APP_VERSION" \
            --vendor "RB Chowdhury" --description "PharmaPack QMS - packaging QMS with serialization line simulator" \
            --input staging --main-jar app.jar \
            --java-options "-Dspring.profiles.active=desktop" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --dest out $EXTRA
          ls out

      - name: Zip portable app (keeps executable permissions)
        run: |
          mkdir -p release
          cd out
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../release/${APP_NAME}-${APP_VERSION}-windows-portable.zip" "$APP_NAME" > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "${APP_NAME}.app" "../release/${APP_NAME}-${APP_VERSION}-macos-portable.zip"
          else
            tar czf "../release/${APP_NAME}-${APP_VERSION}-linux-portable.tar.gz" "$APP_NAME"
          fi
          ls -la ../release

      - name: Create installer (${{ matrix.installer }})
        continue-on-error: true      # the portable zip above is always produced even if this fails
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "Windows" ] && EXTRA="--win-menu --win-shortcut --win-dir-chooser --win-console --win-per-user-install"
          [ "$RUNNER_OS" = "Linux" ] && EXTRA="--linux-shortcut"
          jpackage --type ${{ matrix.installer }} --name "$APP_NAME" --app-version "$APP_VERSION" \
            --vendor "RB Chowdhury" --description "PharmaPack QMS" \
            --input staging --main-jar app.jar \
            --java-options "-Dspring.profiles.active=desktop" \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --dest release $EXTRA
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: PharmaPackQMS-${{ matrix.label }}
          path: release/*

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

# PharmaPack QMS — CI pipeline
# On every push / pull request: MySQL -> backend -> frontend -> API + UI tests (headless Chrome)
# -> Cucumber + Allure reports as downloadable artifacts; on main, Allure is published to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/pharmapack_qms?useSSL=false&serverTimezone=America/New_York&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Load database (schema, seed, migrations)
        run: |
          M="mysql -h 127.0.0.1 -P 3306 -uroot -proot"
          $M < database/schema.sql
          $M pharmapack_qms < database/seed.sql
          $M pharmapack_qms < database/phase2-migration.sql
          $M pharmapack_qms < database/phase3-password-update.sql
          $M pharmapack_qms < database/phase4-systech-serialization.sql
          $M pharmapack_qms -e "SELECT COUNT(*) AS users FROM users; SELECT batch_number FROM batches;"

      - name: Build backend (+ unit tests)
        run: mvn -B -ntp clean package

      - name: Start backend
        run: |
          nohup java -jar target/pharmapack-qms-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products || true)
            if [ "$code" != "000" ]; then echo "Backend up (HTTP $code)"; exit 0; fi
            sleep 2
          done
          echo "Backend did not start"; cat backend.log; exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          nohup npm run dev > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:5173 && { echo "Frontend up"; exit 0; }
            sleep 2
          done
          echo "Frontend did not start"; cat ../frontend.log; exit 1

      - name: Run API + UI tests (headless Chrome)
        working-directory: automation
        run: >
          mvn -B -ntp clean test -Pall
          -Dplatform=chrome -Dheadless=true
          -DbaseUrl=http://localhost:8080/api
          -DuiBaseUrl=http://localhost:5173

      - name: Generate Allure report
        if: always()
        working-directory: automation
        run: mvn -B -ntp allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: automation/target/site/allure-maven-plugin

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: automation/target/cucumber-reports

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log

      - name: Upload Allure report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: automation/target/site/allure-maven-plugin

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

# Standalone desktop edition (-Dspring.profiles.active=desktop): no MySQL needed.
# Data lives in an embedded H2 database in the user's home folder and survives restarts.
# Delete ~/.pharmapack-qms to reset to the demo data.
spring.datasource.url=jdbc:h2:file:${user.home}/.pharmapack-qms/data/qms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,KEY,YEAR,MONTH,DAY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Creates the schema + demo data on first start only (Flyway remembers what it applied)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/desktop

# Open the UI in the default browser and show a tray icon (Open / Quit) when the app starts
app.desktop.open-browser=${OPEN_BROWSER:true}
